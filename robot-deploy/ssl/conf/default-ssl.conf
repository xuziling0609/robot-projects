server {
    listen 80;
    server_name localhost;

    # 根证书直接下载路由（免跳转，便于首次信任导入）
    location = /rootca.crt {
        alias /etc/nginx/cert/rootca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="rootca.crt"';
    }

    # 其他 HTTP 请求强制跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name localhost;

    # SSL 证书配置
    ssl_certificate cert/server.crt;
    ssl_certificate_key cert/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 根证书直接下载路由
    location = /rootca.crt {
        alias /etc/nginx/cert/rootca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="rootca.crt"';
    }

    # 前端H5静态页面
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 反向代理Java后端接口
    location /prod-api/ {
        proxy_pass http://app-java:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass_request_headers on;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
		proxy_set_header X-Forwarded-Prefix /prod-api;
    }

    # WebSocket 配置 - 匹配 /ws/ 开头的路径
    location /ws/ {
        proxy_pass http://app-java:8080/ws/;  # 转发到相同的后端服务
        
        # WebSocket 必需的头部设置
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 传递原始请求信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 超时设置（保持长连接）
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 36000s;  # WebSocket 长连接超时时间，可根据需要调整
    }
    
    # 反向代理EMQX
    location /emqx/ {
        proxy_pass http://app-emqx:18083/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass_request_headers on;

        sub_filter_types text/html text/javascript application/javascript;
        sub_filter_once off;
        sub_filter 'href="/' 'href="/emqx/';
        sub_filter 'src="/'  'src="/emqx/';
    }
    
    # 反向代理go2rtc
    location /go2rtc/ {
        proxy_pass http://app-go2rtc:1984/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass_request_headers on;

        sub_filter_types text/html text/javascript application/javascript;
        sub_filter_once off;
        sub_filter 'href="/' 'href="/go2rtc/';
        sub_filter 'src="/'  'src="/go2rtc/';
    }
    
    # 反向代理seaweedfs
    location /seaweedfs/ {
        proxy_pass http://app-seaweedfs:8888/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass_request_headers on;

        sub_filter_types text/html text/javascript application/javascript;
        sub_filter_once off;
        sub_filter 'href="/' 'href="/seaweedfs/';
        sub_filter 'src="/'  'src="/seaweedfs/';
    }
}