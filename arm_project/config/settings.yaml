# ==============================================================================
# RM65-6F 机械臂三维视觉追踪与避障系统 - 核心配置文件
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 机械臂手眼标定与相机参数 (Calibration Parameters)
# 注: 基于眼在手上 (Eye-in-Hand) 构型，运行 tools/calibrate_hand_eye.py 会自动更新本节点
# ------------------------------------------------------------------------------
calibration:
  # 相机坐标系到机械臂末端法兰坐标系的 4x4 齐次变换矩阵 T_cam2end
  # 变换关系: P_end = T_end_to_camera * P_cam
  T_end_to_camera:
  - [-0.9997429022070294, -0.02260456427697718, -0.0017785276252917286, 
      33.07841368740865]
  - [0.0226127589541443, -0.9997331052704364, -0.004730894081703692, 
      49.81311110374203]
  - [-0.001671113146284713, -0.004769895195760517, 0.9999872276587705, 
      49.80128119092635]
  - [0.0, 0.0, 0.0, 1.0]
  rotation_matrix:
  - [-0.9997429022070294, -0.02260456427697718, -0.0017785276252917286]
  - [0.0226127589541443, -0.9997331052704364, -0.004730894081703692]
  - [-0.001671113146284713, -0.004769895195760517, 0.9999872276587705]
  translation_vector: [33.07841368740865, 49.81311110374203, 49.80128119092635]

  # 3x3 相机内参矩阵 K: [[fx, 0, cx], [0, fy, cy], [0, 0, 1]]
  camera_matrix:
  - [904.2641823874628, 0.0, 631.8311891233457]
  - [0.0, 904.3722883535755, 380.0570984114596]
  - [0.0, 0.0, 1.0]
  dist_coeffs: [0.12937346808008923, -0.42397738791743783, 
      -0.0005924132089042636, -0.0007444802560022025, 0.4289814560000465]

  # 平移向量与几何尺寸单位 (mm 或 m)
  unit: mm

  # OpenCV 手眼标定求解算法 (tsai / park / horaud / andreff / daniilidis)
  method: tsai

  # 相机标定角点重投影均方误差 RMS (单位: 像素，通常需 < 0.5 px)
  rms_error: 0.5290414024259931

  # 标定板在机械臂基座坐标系下空间重构位置的最大偏差 (单位: mm，官方建议 < 10.0mm)
  max_spatial_error: 6.625785434479446

  # 最近一次完成标定的时间戳 (ISO 8601 格式)
  updated_at: '2026-10-09T10:44:07.438195'


# ------------------------------------------------------------------------------
# 2. 网络通信配置 (Network & Protocols)
# ------------------------------------------------------------------------------
network:
  # 上位机业务交互 TCP 服务端 (用于接收 goto / pause / goback 等指令)
  tcp_server:
    host: 0.0.0.0      # 监听 IP 地址 (0.0.0.0 表示监听本机所有网络接口)
    port: 9000         # 监听端口号 (上位机与机械臂系统交互通道)


# ------------------------------------------------------------------------------
# 3. 机械臂硬件与运动控制配置 (Robot Controller & Motion Control)
# ------------------------------------------------------------------------------
robot:
  # 睿尔曼 RM65-6F 控制器网络连接参数
  controller_ip: 192.168.123.65    # 机械臂控制器 IP 地址 (默认出厂网段或局域网静态 IP)
  controller_port: 8080            # 机械臂通信控制端口 (睿尔曼 SDK 默认 8080)

  # 机械臂待机原点位姿 (Home Pose)
  # 格式: 6 自由度关节角度 [J1, J2, J3, J4, J5, J6] (单位: 度 deg)
  home_pose: [88.24, 92.059, -165.194, 4.255, 163.162, 4.689]

  # 机械臂初始巡检扫描位姿 (Scan Pose)
  # 格式: 6 自由度关节角度 [J1, J2, J3, J4, J5, J6] (单位: 度 deg)
  scan_pose: [0.56,82.227,-158.141,2.79,156.001,94.176]

  # 笛卡尔空间软件限位 / 安全电子围栏 (Virtual Fence)
  # 防止机械臂末端运动超出物理安全区间或触碰设备结构件 (单位: mm)
  soft_limits:
    x_min: -500.0      # X 轴负向工作空间极限 (mm)
    x_max: 700.0       # X 轴正向工作空间极限 (mm，覆盖电缆柜目标深度 ~650mm)
    y_min: -500.0      # Y 轴负向工作空间极限 (mm)
    y_max: 500.0       # Y 轴正向工作空间极限 (mm)
    z_min: 0.0         # Z 轴垂直最低安全高度 (mm，防止下探撞击台面/地面)
    z_max: 800.0       # Z 轴垂直最高安全高度 (mm)

  # 关节角度安全限位配置 (Joint Limits)
  # 已取消 J2 硬限制 (设为 null)，恢复机械臂正常前伸作业能力；
  # 安全性由机械臂底层自防碰撞 (self_collision)、工具包络球 (tool_envelope) 与笛卡尔电子围栏 (soft_limits) 全权保障。
  joint_limits:
    j2_max_deg: null          # 关节2安全参考基准角度 (null 表示不限制，恢复完整前伸工作空间)
    directional_constraint: false # 关闭单向约束

  # 主动扫描探索 (Active Scanning)
  # 当视觉视野不完整 (丢失目标或不满足全视场) 时，仅沿相机垂直方向微幅平移调整视野 (严禁左右摆臂)
  active_scanning:
    max_scan_time_sec: 60.0   # 主动扫描最大超时时间 (秒)，超时未识别到电缆则自动停止并复位
    scan_axis: "vertical"     # 扫描模式: vertical (仅沿相机垂直上下方向微幅平移调整视野，严禁左右摆臂)
    amplitude_mm: 35.0        # 垂直微调扫描振幅 (mm，适度微调，避免晃动产生画面拖影)
    frequency: 0.3            # 扫描振荡频率 (Hz，周期约 3.3s，慢速平稳无剧烈摆动)
    speed: 10.0               # 扫描运动速度百分比 (1~100)
    amplitude_z_mm: 35.0      # 兼容旧参数字段

  # 机械臂本体与末端工具自防碰撞配置 (Self-Collision & Tool Envelope Protection)
  self_collision:
    enabled: true             # 是否启用自碰撞检测 (包含底层控制器安全使能 + 逆解/关节算法预检)
    tool_envelope:
      enabled: true           # 是否启用末端相机/工具包络球保护 (防止工具与本体发生碰撞)
      radius_m: 0.050         # 包络球半径 (米，50mm 半径/100mm 直径完整覆盖 D435i 相机本体与手眼法兰支架，且不产生待机原点误报)
      center_m: [0.033, 0.050, 0.050] # 包络球在末端法兰坐标系下的中心坐标 [X, Y, Z] (米)

  # 接近目标业务参数优化 (参考 RealMan verticalGrab 规范)
  target_approach:
    enabled: true                 # 是否启用优化后的多阶段接近控制
    staged_approach: true         # 启用预接近悬停 -> 姿态对齐 -> 垂直精准贴近三阶段控制
    pre_approach_distance_mm: 350.0 # 阶段1: 预接近安全悬停距离 (mm，距目标 > 此值全速推进)
    final_target_distance_mm: 200.0 # 阶段3: 最终精细到达作业距离 (mm)
    reach_tolerance_mm: 100.0      # 到达判定与安全观测停止距离 (mm，相对目标电缆保持安全观测距离 ~200mm，避开相机盲区并防止末端撞击电缆)
    speed_coarse: 12.0            # 阶段1粗逼近速度百分比 (1~100)
    speed_fine: 6.0               # 阶段3精细贴近降速百分比 (1~100)
    target_align_rpy: [1.398, -0.025, 1.605] # 作业对齐标准姿态 (RPY rad)，与巡检正视姿态保持严格一致
    depth_top_ratio: 0.20         # 鲁棒深度前百分比 (RealMan 20% 最近深度算法)


# ------------------------------------------------------------------------------
# 4. 视觉感知与局部避障规划配置 (Vision & APF Motion Planning)
# ------------------------------------------------------------------------------
vision:
  # YOLO 目标检测 / 分割模型权重文件路径
  # 在 Jetson Orin 上推荐使用 TensorRT FP16 编译生成的 .engine 文件以获得极致性能 (约 7ms)
  model_path: models/demo.pt

  # 是否剔除视野最上方电缆 (默认 false: 点位 1~4 严格对应画面从上至下第 1~4 根电缆；若设为 true 则剔除最上方电缆，点位 1~3 对应第 2~4 根)
  exclude_spare_cable: false

  # Intel RealSense D435 双目深度相机视频流配置
  camera:
    color_width: 1280      # 彩色流分辨率 - 宽度 (px)
    color_height: 720      # 彩色流分辨率 - 高度 (px)
    depth_width: 848       # 深度流分辨率 - 宽度 (px)
    depth_height: 480      # 深度流分辨率 - 高度 (px)
    fps: 30                # 采集帧率 (FPS)

  # 人工势场法 (Artificial Potential Field, APF) 局部运动避障规划参数
  apf:
    max_z_mm: 300          # 局部避障感知最大深度距离 (mm，超出此距离的点云不计算斥力)
    safe_distance_mm: 200  # 绝对安全警戒距离 (mm，进入此距离后斥力急剧上升)

    # 巡检机器人搭载的海康双光云台 (PTZ) 静态包围球避障模型
    ptz_obstacle:
      enabled: true        # 是否启用云台防撞保护
      # 云台几何中心在机械臂基座坐标系 (Base Frame) 下的位置 [X, Y, Z] (单位: mm)
      center_base_mm: [450.0, 0.0, 150.0]
      radius_mm: 250.0     # 云台安全包围球保护半径 (mm，末端进入该半径内将产生强推斥力)
      k_rep_ptz: 10000.0   # 云台静态障碍物斥力增益系数 (强力推开机械臂防止碰撞云台)
